
name: VisionGuard CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://visionguard:testpassword@localhost:5432/visionguard
      FLASK_SECRET_KEY: ci-test-secret
      MODEL_PATH: models/champion.keras

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: visionguard
          POSTGRES_USER: visionguard
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visionguard -d visionguard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r req-docker.txt
          pip install ruff pytest

      - name: Check Python syntax
        run: python -m compileall -q app.py inference.py

      - name: Run linting
        run: ruff check --select E9,F63,F7,F82 app.py inference.py

      - name: Run tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -t visionguard:ci .
